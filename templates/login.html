{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 30px; font-size: 1.8rem;">Вход в систему</h2>
        
        {% if error %}
        <div style="background-color: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main);">Email</label>
                <input type="email" name="email" required placeholder="your@email.com" style="width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem;">
            </div>
            
            <div style="margin-bottom: 30px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main);">Пароль</label>
                <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; font-size: 1.1rem;">Войти</button>
        </form>

        <p style="text-align: center; margin-top: 25px; color: var(--text-muted); font-size: 0.95rem;">
            Нет аккаунта? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Зарегистрируйтесь</a>
        </p>
    </div>
</div>
{% endblock %}
